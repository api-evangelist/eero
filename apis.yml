name: Eero
description: >-
  eero makes home mesh Wi-Fi systems that are simple, powerful, secure, and reliable. eero
  pioneered home mesh wifi and sells products for homes, businesses, service providers, pro
  installers, and communities, including the eero Pro 7, eero PoE 7, and eero Signal, plus the
  eero Plus subscription for enhanced security and multi-network management. Devices are managed
  through the award-winning eero app and are deployed across 27+ countries. eero LLC is based in
  San Francisco, CA and is an Amazon company. eero does not publish a public developer API or
  first-party SDK; the eero app communicates with a private, unpublished backend.
